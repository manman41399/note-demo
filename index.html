<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 网页待办清单，本人修改页面配色，前端入门练习项目 --> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的日常清单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
/* 页面整体样式：设置渐变背景、居中布局、字体 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #88d8b0 0%, #c7ecee 100%);          min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 20px;
            color: #2d3436;
        }
/* 卡片容器：承载全部页面内容，米色底色、圆角+阴影，限制卡片最大宽度 */
        .container {
            background: #fff8e8;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            color:#604835;
        }
/* 副标题文字样式：浅棕字体，居中对齐，设置下方外边距 */
        .subtitle {
            text-align: center;
            font-size: 14px;
            color:#7c6a5e;
            margin-bottom: 28px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
/* 任务输入框：用来输入待办文字，设置边框圆角 */
        #taskInput {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #ececec;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            color: #2d3436;
        }

        #taskInput:focus {
            border-color: #8ec5fc;
        }
/* 添加任务按钮：豆沙紫色，鼠标悬浮会轻微上浮，带阴影过渡动画 */
        #addBtn {
            background: #92689c;
            color: #fff;
            border: none;
            padding: 0 22px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            white-space: nowrap;
        }

        #addBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(118, 75, 162, 0.35);
        }

        #addBtn:active {
            transform: translateY(0);
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
            justify-content: center;
        }

        .filter-btn {
            background: transparent;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #999;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: #f0f4ff;
            color: #667eea;
            font-weight: 500;
        }

        ul {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 14px 14px 14px 18px;
            background: #fafbfc;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.2s;
            animation: slideIn 0.25s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .task-item:hover {
            background: #f4f6f8;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #d0d0d0;
            border-radius: 50%;
            margin-right: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .checkbox.checked {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
        }

        .checkbox.checked::after {
            content: '';
            width: 6px;
            height: 10px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-top: -2px;
        }

        .task-text {
            flex: 1;
            font-size: 15px;
            color: #2d3436;
            word-break: break-word;
        }

        .task-item.done .task-text {
            text-decoration: line-through;
            color: #b0b0b0;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ccc;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }

        .empty {
            text-align: center;
            color: #c0c0c0;
            font-size: 14px;
            padding: 40px 0;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            color: #b0b0b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>待办清单</h1>
        <p class="subtitle">记录每一件重要的小事</p>

        <div class="input-row">
            <input type="text" id="taskInput" placeholder="输入任务后回车或点击添加..." maxlength="100">
            <button id="addBtn">添加</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="active">未完成</button>
            <button class="filter-btn" data-filter="done">已完成</button>
        </div>

        <ul id="taskList"></ul>

        <div class="footer" id="footer"></div>
    </div>

    <script>
        const input = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const list = document.getElementById('taskList');
        const footer = document.getElementById('footer');
        const filterBtns = document.querySelectorAll('.filter-btn');

        let tasks = [];
        let currentFilter = 'all';

        function save() {
            localStorage.setItem('todo_tasks', JSON.stringify(tasks));
        }

        function load() {
            const data = localStorage.getItem('todo_tasks');
            if (data) tasks = JSON.parse(data);
        }

        function render() {
            list.innerHTML = '';
            const filtered = tasks.filter(t => {
                if (currentFilter === 'active') return !t.done;
                if (currentFilter === 'done') return t.done;
                return true;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<li class="empty">暂无任务</li>';
            } else {
                filtered.forEach(t => {
                    const li = document.createElement('li');
                    li.className = 'task-item' + (t.done ? ' done' : '');
                    li.innerHTML = `
                        <div class="checkbox${t.done ? ' checked' : ''}" data-id="${t.id}"></div>
                        <span class="task-text">${escapeHtml(t.text)}</span>
                        <button class="delete-btn" data-id="${t.id}" title="删除">✕</button>
                    `;
                    list.appendChild(li);
                });
            }

            const activeCount = tasks.filter(t => !t.done).length;
            const doneCount = tasks.length - activeCount;
            footer.textContent = tasks.length
                ? `共 ${tasks.length} 项 · 未完成 ${activeCount} · 已完成 ${doneCount}`
                : '';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function addTask() {
            const text = input.value.trim();
            if (!text) return;
            tasks.unshift({ id: Date.now(), text, done: false });
            input.value = '';
            save();
            render();
        }

        function toggleTask(id) {
            const t = tasks.find(t => t.id === id);
            if (t) { t.done = !t.done; save(); render(); }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            save();
            render();
        }

        addBtn.addEventListener('click', addTask);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

        list.addEventListener('click', e => {
            const id = Number(e.target.dataset.id);
            if (!id) return;
            if (e.target.classList.contains('checkbox')) toggleTask(id);
            else if (e.target.classList.contains('delete-btn')) deleteTask(id);
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        load();
        render();
    </script>
</body>
</html>
